<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kabx — Parça detayı</title>

</head>
<body>
<x-dc>
<helmet>

<style>

button{font-family:inherit;cursor:pointer}

<main style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 60px 16px 0; display: flex; flex-direction: column; gap: 14px; background: #F5EFE6; color: #1D1915; font-family: 'DM Sans', system-ui, sans-serif;">

<header style="display: flex; align-items: center; justify-content: space-between;">
<a href="Wardrobe.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFCF7; border: 1px solid #E2D8C9; display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1915" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<button type="button" aria-label="Daha fazla" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFCF7; border: 1px solid #E2D8C9; display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#1D1915" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
</button>

<div style="height: 170px; border-radius: 28px; background: #EDE5D8; display: flex; align-items: center; justify-content: center; position: relative;">
<svg viewBox="0 0 100 100" width="150" height="150" aria-hidden="true" style="filter: drop-shadow(0 10px 16px rgba(29,25,21,0.2)); transform: rotate(-4deg);"><path d="M33 12 L44 8 L50 18 L56 8 L67 12 L86 34 L78 42 L68 32 L68 92 L32 92 L32 32 L22 42 L14 34 Z" fill="#FFFFFF" stroke="#1D1915" stroke-width="1.6" stroke-linejoin="round"></path><path d="M50 18 L50 90" stroke="#1D1915" stroke-width="1" stroke-dasharray="0.1 9" stroke-linecap="round"></path></svg>
<span style="position: absolute; left: 14px; bottom: 14px; padding: 6px 10px; border-radius: 999px; background: #FFFCF7; font-size: 12px; font-weight: 700;">7 kez giyildi · son 3 gün önce</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 26px; font-weight: 700; letter-spacing: -0.01em;">Beyaz poplin gömlek</h1>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6A6158;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="#6A6158" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
Yapay zekâ etiketledi. Dokunarak düzeltebilirsin.
</span>
</div>

<dl style="margin: 0; border-radius: 20px; background: #FFFCF7; display: flex; flex-direction: column;">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
<div style="min-height: 40px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: {{t.rule}};">
<dt style="font-size: 14px; color: #6A6158;">{{t.k}}</dt>
<dd style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700;">
<sc-if value="{{t.sw}}" hint-placeholder-val="{{false}}"><span style="width: 16px; height: 16px; border-radius: 999px; background: {{t.sw}}; border: 1px solid #1D1915;"></span></sc-if>
{{t.v}}
</dd>
</div>
</sc-for>
</dl>

<div style="padding: 12px 14px; border-radius: 18px; background: #FBE3D6; display: flex; align-items: center; gap: 12px;">
<div style="display: flex;">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFCF7; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><path d="M33 12 L44 8 L50 18 L56 8 L67 12 L86 34 L78 42 L68 32 L68 92 L32 92 L32 32 L22 42 L14 34 Z" fill="#FFFFFF" stroke="#1D1915" stroke-width="3"></path></svg></span>
<span style="width: 40px; height: 40px; margin-left: -10px; border-radius: 12px; background: #FFFCF7; border: 2px solid #FBE3D6; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><path d="M33 12 L44 8 L50 18 L56 8 L67 12 L86 34 L78 42 L68 32 L68 92 L32 92 L32 32 L22 42 L14 34 Z" fill="#F4F1EA" stroke="#1D1915" stroke-width="3"></path></svg></span>
</div>
<span style="flex-grow: 1; font-size: 13px; line-height: 1.35;"><strong>Benzeri var:</strong> 2 beyaz gömleğin daha var.</span>
<a href="#" style="font-size: 13px; font-weight: 700; color: #1D1915;">Gör</a>
</div>

<a href="OutfitBuilder.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 56px; border-radius: 18px; background: #1D1915; color: #F5EFE6; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none;">Bununla kombin yap</a>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { k: 'Kategori', v: 'Üst › Gömlek' },
      { k: 'Renk', v: 'Beyaz', sw: '#FFFFFF' },
      { k: 'Desen', v: 'Düz' },
      { k: 'Kumaş', v: 'Pamuk poplin' },
      { k: 'Mevsim', v: 'İlkbahar, Yaz, Sonbahar' },
      { k: 'Resmiyet', v: '4 / 5 · Resmi' },
      { k: 'Stil', v: 'Klasik, Minimal' }
    ];
    return { tags: rows.map((r, i) => ({ ...r, sw: r.sw || '', rule: i === rows.length - 1 ? 'none' : '1px solid #EFE7DA' })) };
  }
}
</script>
</body>
</html>
