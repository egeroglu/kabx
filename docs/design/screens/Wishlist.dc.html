<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kabx — Wishlist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
body{margin:0;background:#F5EFE6}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 60px 16px 0; display: flex; flex-direction: column; gap: 14px; background: #F5EFE6; color: #1D1915; font-family: 'DM Sans', system-ui, sans-serif;">

<header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;">Wishlist</h1>
<span style="font-size: 13px; color: #6A6158;">14 parça · 5 tanesine 2 haftadır bakmadın</span>
</div>
</header>

<a href="#" style="padding: 14px 16px; border-radius: 20px; background: #1D1915; color: #F5EFE6; display: flex; align-items: center; gap: 12px; text-decoration: none;">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #F0643A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1915" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="11" height="15" rx="2.5"></rect><path d="M9 3.5l8.6 1.6a2.4 2.4 0 0 1 1.9 2.8l-2 10.6"></path></svg>
</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 15px; font-weight: 700;">Hâlâ istiyor musun?</span>
<span style="font-size: 12px; color: #D9CFC2;">5 parçayı kaydırarak ayıkla</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5EFE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>

<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<li style="padding: 12px; border-radius: 22px; background: #FFFCF7; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; gap: 12px; align-items: center;">
<div style="width: 76px; height: 76px; flex-shrink: 0; border-radius: 16px; background: {{it.stage}}; display: flex; align-items: center; justify-content: center;">
<svg viewBox="0 0 100 100" width="58" height="58" aria-hidden="true"><path d="{{it.d}}" fill="{{it.c}}" stroke="#1D1915" stroke-width="2.2" stroke-linejoin="round"></path></svg>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
<span style="font-size: 12px; font-weight: 600; color: #6A6158;">{{it.store}}</span>
<span style="font-size: 15px; font-weight: 700;">{{it.name}}</span>
<span style="font-size: 13px; color: #6A6158;">Kaydederken {{it.price}}</span>
</div>
</div>
<sc-if value="{{it.warn}}" hint-placeholder-val="{{false}}">
<span style="padding: 6px 10px; border-radius: 12px; background: #FBE3D6; font-size: 12px; font-weight: 600;">{{it.warn}}</span>
</sc-if>
<div style="display: flex; gap: 8px;">
<a href="OutfitBuilder.dc.html" style="flex: 1 1 0; height: 44px; border-radius: 14px; border: 1.5px solid #1D1915; color: #1D1915; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; text-decoration: none;">Bunu alsam mı?</a>
<a href="#" style="flex: 1 1 0; height: 44px; border-radius: 14px; background: #1D1915; color: #F5EFE6; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; text-decoration: none;">Mağazaya git
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F5EFE6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"></path></svg>
</a>
</div>
</li>
</sc-for>
</ul>

<div style="position: absolute; left: 0; bottom: 0;">
<dc-import name="TabBar" active="discover" hint-size="390px,88px"></dc-import>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      blazer: 'M30 10 L44 8 L50 40 L56 8 L70 10 L86 62 L76 66 L70 42 L70 92 L30 92 L30 42 L24 66 L14 62 Z',
      dress: 'M41 6 L59 6 L57 26 L76 92 L24 92 L43 26 Z',
      shirt: 'M33 12 L44 8 L50 18 L56 8 L67 12 L86 34 L78 42 L68 32 L68 92 L32 92 L32 32 L22 42 L14 34 Z'
    };
    return {
      items: [
        { store: '[Mağaza adı]', name: 'Oversize trençkot', price: '[Fiyat]', d: P.blazer, c: '#C99A6B', stage: '#EDE5D8', warn: '' },
        { store: '[Mağaza adı]', name: 'Saten midi elbise', price: '[Fiyat]', d: P.dress, c: '#A99BF5', stage: '#E9E1F7', warn: '' },
        { store: '[Mağaza adı]', name: 'Beyaz oversize gömlek', price: '[Fiyat]', d: P.shirt, c: '#FFFFFF', stage: '#EDE5D8', warn: 'Benzeri var: gardırobunda 3 beyaz gömlek var' }
      ]
    };
  }
}
</script>
</body>
</html>
