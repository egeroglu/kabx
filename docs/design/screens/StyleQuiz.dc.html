<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kabx — Stil testi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
body{margin:0;background:#F5EFE6}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 60px 16px 0; display: flex; flex-direction: column; gap: 16px; background: #F5EFE6; color: #1D1915; font-family: 'DM Sans', system-ui, sans-serif;">

<div style="display: flex; align-items: center; gap: 12px;">
<div role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{n}}" aria-label="Stil testi ilerlemesi" style="flex-grow: 1; height: 8px; border-radius: 999px; background: #E2D8C9; overflow: hidden;">
<div style="width: {{pct}}%; height: 8px; border-radius: 999px; background: #F0643A;"></div>
</div>
<span style="font-size: 13px; font-weight: 700;">{{n}} / 20</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05;">Bu kombin senlik mi?</h1>
<p style="margin: 0; font-size: 14px; color: #6A6158;">Kaydır ya da dokun. Doğru cevap yok, sadece zevkin.</p>
</div>

<div style="position: relative; height: 480px;">
<div aria-hidden="true" style="position: absolute; inset: 12px 8px -4px; border-radius: 30px; background: #E9D8A6; transform: rotate(-4deg);"></div>
<article style="position: absolute; inset: 0; border-radius: 30px; background: {{look.stage}}; overflow: hidden; box-shadow: 0 16px 36px rgba(29,25,21,0.14); transform: rotate(2deg);">
<sc-for list="{{look.items}}" as="g" hint-placeholder-count="3">
<svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; left: {{g.x}}px; top: {{g.y}}px; width: {{g.s}}px; height: {{g.s}}px; transform: rotate({{g.r}}deg); filter: drop-shadow(0 8px 12px rgba(29,25,21,0.2));"><path d="{{g.d}}" fill="{{g.c}}" stroke="#1D1915" stroke-width="1.6" stroke-linejoin="round"></path></svg>
</sc-for>
<span style="position: absolute; left: 18px; top: 18px; padding: 8px 12px; border-radius: 12px; border: 2.5px solid #F0643A; color: #1D1915; background: #FFFCF7; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 18px; font-weight: 800; transform: rotate(-10deg);">BENİM!</span>
</article>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 22px;">
<button type="button" onClick="{{next}}" aria-label="Beğenmedim" style="width: 64px; height: 64px; border-radius: 999px; border: 1.5px solid #1D1915; background: #FFFCF7; display: flex; align-items: center; justify-content: center;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D1915" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<button type="button" onClick="{{back}}" aria-label="Geri al" style="width: 46px; height: 46px; border-radius: 999px; border: none; background: #EDE5D8; display: flex; align-items: center; justify-content: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1915" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
</button>
<button type="button" onClick="{{next}}" aria-label="Beğendim" style="width: 64px; height: 64px; border-radius: 999px; border: none; background: #F0643A; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(240,100,58,0.35);">
<svg width="28" height="28" viewBox="0 0 24 24" fill="#1D1915" aria-hidden="true"><path d="M12 20.5s-7.2-4.5-9.2-9.2A4.9 4.9 0 0 1 12 8a4.9 4.9 0 0 1 9.2 3.3c-2 4.7-9.2 9.2-9.2 9.2z"></path></svg>
</button>
</div>

<a href="StyleResult.dc.html" style="align-self: center; font-size: 14px; font-weight: 600; color: #6A6158; text-decoration: underline; text-underline-offset: 3px; padding: 8px;">Sonucu şimdi gör</a>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { n: 7 }; }
  renderVals() {
    const P = {
      tee: 'M32 14 L44 9 Q50 16 56 9 L68 14 L84 30 L74 40 L68 34 L68 90 L32 90 L32 34 L26 40 L16 30 Z',
      skirt: 'M33 14 L67 14 L82 84 L18 84 Z',
      sneaker: 'M8 62 Q10 44 26 44 L40 50 Q58 58 80 59 Q94 61 94 72 L94 80 L8 80 Z',
      knit: 'M32 12 L44 8 Q50 14 56 8 L68 12 L88 62 L78 66 L68 38 L68 90 L32 90 L32 38 L22 66 L12 62 Z',
      jeans: 'M30 8 L70 8 L77 92 L58 92 L50 36 L42 92 L23 92 Z',
      loafer: 'M10 66 Q14 52 30 54 L60 58 Q86 60 90 70 L90 78 L10 78 Z'
    };
    const looks = [
      { stage: '#E9E1F7', items: [ { d: P.tee, c: '#FFFFFF', x: 36, y: 60, s: 170, r: -6 }, { d: P.skirt, c: '#F0643A', x: 180, y: 120, s: 160, r: 5 }, { d: P.sneaker, c: '#E9D8A6', x: 70, y: 280, s: 150, r: 0 } ] },
      { stage: '#E6EEDC', items: [ { d: P.knit, c: '#2F3B2C', x: 30, y: 50, s: 180, r: 4 }, { d: P.jeans, c: '#4A6FA5', x: 180, y: 110, s: 160, r: -3 }, { d: P.loafer, c: '#9C5A34', x: 60, y: 290, s: 140, r: 0 } ] }
    ];
    const n = this.state.n;
    return {
      n,
      pct: Math.round((n / 20) * 100),
      look: looks[n % looks.length],
      next: () => this.setState({ n: Math.min(20, n + 1) }),
      back: () => this.setState({ n: Math.max(1, n - 1) })
    };
  }
}
</script>
</body>
</html>
