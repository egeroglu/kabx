<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kabx — Gardırop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
body{margin:0;background:#F5EFE6}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 60px 0 0; display: flex; flex-direction: column; gap: 14px; background: #F5EFE6; color: #1D1915; font-family: 'DM Sans', system-ui, sans-serif;">

<header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 20px;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;">Gardırop</h1>
<span style="font-size: 13px; color: #6A6158;">86 parça · 3 tanesi işleniyor</span>
</div>
<a href="Cleanup.dc.html" style="height: 36px; padding: 0 12px; border-radius: 999px; background: #FFFCF7; border: 1px solid #E2D8C9; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #1D1915; text-decoration: none;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1915" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0"></path></svg>
Temizlik
</a>
</header>

<div style="padding: 0 16px;">
<label for="wsearch" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; background: #FFFCF7; border: 1px solid #E2D8C9; display: flex; align-items: center; gap: 10px;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A6158" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Gardıropta ara</span>
<input id="wsearch" type="search" placeholder="Renk, parça veya stil ara" style="flex-grow: 1; border: none; background: transparent; font-size: 15px; color: #1D1915; outline: none;">
</label>
</div>

<div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden;">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="6">
<button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; border: {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font-size: 14px; font-weight: 700;">{{k.t}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 16px;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="12">
<a href="ItemDetail.dc.html" aria-label="{{it.name}}" style="height: 112px; border-radius: 20px; background: #FFFCF7; position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none;">
<svg viewBox="0 0 100 100" width="76" height="76" aria-hidden="true" style="opacity: {{it.op}};"><path d="{{it.d}}" fill="{{it.c}}" stroke="#1D1915" stroke-width="2" stroke-linejoin="round"></path></svg>
<sc-if value="{{it.busy}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 4px 0; border-radius: 999px; background: #E9E1F7; color: #1D1915; font-size: 10px; font-weight: 700; text-align: center;">Etiketleniyor…</span>
</sc-if>
</a>
</sc-for>
</div>

<a href="AddItems.dc.html" aria-label="Parça ekle" style="position: absolute; right: 20px; bottom: 108px; width: 60px; height: 60px; border-radius: 20px; background: #1D1915; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(29,25,21,0.28);">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F5EFE6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>

<div style="position: absolute; left: 0; bottom: 0;">
<dc-import name="TabBar" active="wardrobe" hint-size="390px,88px"></dc-import>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    const P = {
      shirt: 'M33 12 L44 8 L50 18 L56 8 L67 12 L86 34 L78 42 L68 32 L68 92 L32 92 L32 32 L22 42 L14 34 Z',
      tee: 'M32 14 L44 9 Q50 16 56 9 L68 14 L84 30 L74 40 L68 34 L68 90 L32 90 L32 34 L26 40 L16 30 Z',
      knit: 'M32 12 L44 8 Q50 14 56 8 L68 12 L88 62 L78 66 L68 38 L68 90 L32 90 L32 38 L22 66 L12 62 Z',
      blazer: 'M30 10 L44 8 L50 40 L56 8 L70 10 L86 62 L76 66 L70 42 L70 92 L30 92 L30 42 L24 66 L14 62 Z',
      pants: 'M30 8 L70 8 L75 92 L57 92 L50 34 L43 92 L25 92 Z',
      jeans: 'M30 8 L70 8 L77 92 L58 92 L50 36 L42 92 L23 92 Z',
      skirt: 'M33 14 L67 14 L82 84 L18 84 Z',
      dress: 'M41 6 L59 6 L57 26 L76 92 L24 92 L43 26 Z',
      loafer: 'M10 66 Q14 52 30 54 L60 58 Q86 60 90 70 L90 78 L10 78 Z',
      sneaker: 'M8 62 Q10 44 26 44 L40 50 Q58 58 80 59 Q94 61 94 72 L94 80 L8 80 Z',
      bag: 'M22 40 L78 40 L84 90 L16 90 Z M36 40 Q36 18 50 18 Q64 18 64 40 L60 40 Q60 22 50 22 Q40 22 40 40 Z'
    };
    const cats = ['Tümü', 'Üst', 'Alt', 'Elbise', 'Ayakkabı', 'Dış giyim', 'Çanta'];
    const it = (name, d, c, busy) => ({ name, d, c, busy: !!busy, op: busy ? 0.45 : 1 });
    return {
      cats: cats.map((t, i) => ({ t, bg: i === 0 ? '#1D1915' : '#FFFCF7', fg: i === 0 ? '#F5EFE6' : '#1D1915', border: i === 0 ? 'none' : '1px solid #E2D8C9' })),
      items: [
        it('Beyaz poplin gömlek', P.shirt, '#FFFFFF', true),
        it('Lila tişört', P.tee, '#A99BF5', true),
        it('Camel blazer', P.blazer, '#C99A6B', true),
        it('Krem triko', P.knit, '#F4E9D8'),
        it('Açık mavi jean', P.jeans, '#7FA3D6'),
        it('Siyah kumaş pantolon', P.pants, '#2A2420'),
        it('Siyah midi elbise', P.dress, '#2F3B2C'),
        it('Bej kalem etek', P.skirt, '#C99A6B'),
        it('Mercan çanta', P.bag, '#F0643A'),
        it('Siyah loafer', P.loafer, '#1D1915'),
        it('Beyaz sneaker', P.sneaker, '#FFFFFF'),
        it('Sarı triko', P.knit, '#E9C46A')
      ]
    };
  }
}
</script>
</body>
</html>
