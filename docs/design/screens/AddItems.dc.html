<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kabx — Parça ekle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
body{margin:0;background:#F5EFE6}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 60px 16px 0; display: flex; flex-direction: column; gap: 16px; background: #F5EFE6; color: #1D1915; font-family: 'DM Sans', system-ui, sans-serif;">

<header style="display: flex; align-items: center; justify-content: space-between;">
<a href="Wardrobe.dc.html" aria-label="Kapat" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFCF7; border: 1px solid #E2D8C9; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1915" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 22px; font-weight: 700;">Parça ekle</h1>
<span style="width: 44px;"></span>
</header>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<button type="button" style="height: 64px; border-radius: 18px; border: none; background: #1D1915; color: #F5EFE6; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5EFE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Fotoğraf çek
</button>
<button type="button" style="height: 64px; border-radius: 18px; border: 1.5px solid #1D1915; background: #FFFCF7; color: #1D1915; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1915" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect><path d="M4 16l5-5 4 4 3-3 4 4"></path></svg>
Galeriden seç
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<h2 style="margin: 0; font-size: 15px; font-weight: 700;">6 fotoğraf seçildi</h2>
<span style="font-size: 13px; font-weight: 700;">4 / 6 hazır</span>
</div>
<div style="height: 8px; border-radius: 999px; background: #E2D8C9; overflow: hidden;"><div style="width: 66%; height: 8px; border-radius: 999px; background: #F0643A;"></div></div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<div style="height: 150px; border-radius: 22px; background: {{it.bg}}; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;">
<svg viewBox="0 0 100 100" width="104" height="104" aria-hidden="true" style="opacity: {{it.op}}; filter: drop-shadow(0 6px 10px rgba(29,25,21,0.16));"><path d="{{it.d}}" fill="{{it.c}}" stroke="#1D1915" stroke-width="1.8" stroke-linejoin="round"></path></svg>
<span style="position: absolute; left: 8px; bottom: 8px; padding: 5px 9px; border-radius: 999px; background: {{it.tagBg}}; color: {{it.tagFg}}; font-size: 11px; font-weight: 700;">{{it.state}}</span>
<sc-if value="{{it.label}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 10px; top: 10px; font-size: 12px; font-weight: 700;">{{it.label}}</span>
</sc-if>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; flex-direction: column; gap: 8px;">
<a href="Wardrobe.dc.html" style="height: 56px; border-radius: 18px; background: #1D1915; color: #F5EFE6; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none;">Hazır olan 4 parçayı ekle</a>
<span style="font-size: 12px; color: #6A6158; text-align: center;">Diğerleri arka planda bitince gardırobuna düşer.</span>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      tee: 'M32 14 L44 9 Q50 16 56 9 L68 14 L84 30 L74 40 L68 34 L68 90 L32 90 L32 34 L26 40 L16 30 Z',
      skirt: 'M33 14 L67 14 L82 84 L18 84 Z',
      dress: 'M41 6 L59 6 L57 26 L76 92 L24 92 L43 26 Z',
      knit: 'M32 12 L44 8 Q50 14 56 8 L68 12 L88 62 L78 66 L68 38 L68 90 L32 90 L32 38 L22 66 L12 62 Z',
      sneaker: 'M8 62 Q10 44 26 44 L40 50 Q58 58 80 59 Q94 61 94 72 L94 80 L8 80 Z',
      bag: 'M22 40 L78 40 L84 90 L16 90 Z M36 40 Q36 18 50 18 Q64 18 64 40 L60 40 Q60 22 50 22 Q40 22 40 40 Z'
    };
    const ready = (d, c, label) => ({ d, c, label, bg: '#FFFCF7', op: 1, state: 'Hazır', tagBg: '#1D1915', tagFg: '#F5EFE6' });
    return {
      items: [
        ready(P.tee, '#A99BF5', 'Tişört · Lila'),
        ready(P.skirt, '#C99A6B', 'Etek · Bej'),
        ready(P.dress, '#2F3B2C', 'Elbise · Haki'),
        ready(P.sneaker, '#FFFFFF', 'Sneaker · Beyaz'),
        { d: P.knit, c: '#E9C46A', label: '', bg: '#E9E1F7', op: 0.5, state: 'Etiketleniyor…', tagBg: '#FFFCF7', tagFg: '#1D1915' },
        { d: P.bag, c: '#F0643A', label: '', bg: '#D8CFC2', op: 0.35, state: 'Arka plan siliniyor…', tagBg: '#FFFCF7', tagFg: '#1D1915' }
      ]
    };
  }
}
</script>
</body>
</html>
