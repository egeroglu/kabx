<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kabx — Gardırop temizliği</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
body{margin:0;background:#E6EEDC}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 60px 16px 0; display: flex; flex-direction: column; gap: 16px; background: #E6EEDC; color: #1D1915; font-family: 'DM Sans', system-ui, sans-serif;">

<header style="display: flex; align-items: center; justify-content: space-between;">
<a href="Wardrobe.dc.html" aria-label="Kapat" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFCF7; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1915" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<span style="font-size: 14px; font-weight: 700;">Temizlik · {{pos}} / 12</span>
<span style="width: 44px;"></span>
</header>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05;">{{card.title}}</h1>
<p style="margin: 0; font-size: 14px; color: #4F5A47;">{{card.meta}}</p>
</div>

<article style="height: 430px; border-radius: 32px; background: #FFFCF7; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 36px rgba(29,25,21,0.12); transform: rotate(-1.5deg);">
<svg viewBox="0 0 100 100" width="270" height="270" aria-hidden="true" style="filter: drop-shadow(0 10px 16px rgba(29,25,21,0.2));"><path d="{{card.d}}" fill="{{card.c}}" stroke="#1D1915" stroke-width="1.4" stroke-linejoin="round"></path></svg>
<span style="position: absolute; left: 18px; bottom: 18px; padding: 7px 12px; border-radius: 999px; background: #EDE5D8; font-size: 13px; font-weight: 700;">{{card.name}}</span>
</article>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<button type="button" onClick="{{decide}}" style="height: 64px; border-radius: 20px; border: 1.5px solid #1D1915; background: #FFFCF7; color: #1D1915; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1915" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0"></path></svg>
Bağışla
</button>
<button type="button" onClick="{{decide}}" style="height: 64px; border-radius: 20px; border: none; background: #1D1915; color: #F5EFE6; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#F5EFE6" aria-hidden="true"><path d="M12 20.5s-7.2-4.5-9.2-9.2A4.9 4.9 0 0 1 12 8a4.9 4.9 0 0 1 9.2 3.3c-2 4.7-9.2 9.2-9.2 9.2z"></path></svg>
Tut
</button>
</div>
<p style="margin: 0; font-size: 12px; color: #4F5A47; text-align: center;">Sola kaydır: bağışla · Sağa kaydır: tut</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const cards = [
      { title: 'Bunu 7 aydır giymedin', meta: 'Mart 2025’te eklendi · 1 kez giyildi', name: 'Sarı triko', c: '#E9C46A', d: 'M32 12 L44 8 Q50 14 56 8 L68 12 L88 62 L78 66 L68 38 L68 90 L32 90 L32 38 L22 66 L12 62 Z' },
      { title: 'Hiç giymedin', meta: '8 ay önce eklendi · 0 kez giyildi', name: 'Kargo pantolon', c: '#7C8A5A', d: 'M30 8 L70 8 L75 92 L57 92 L50 34 L43 92 L25 92 Z' }
    ];
    const i = this.state.i % cards.length;
    return { card: cards[i], pos: 3 + this.state.i, decide: () => this.setState({ i: this.state.i + 1 }) };
  }
}
</script>
</body>
</html>
