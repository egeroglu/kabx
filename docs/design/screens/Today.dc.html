<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kabx — Bugün</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
body{margin:0;background:#F5EFE6}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 60px 16px 0; display: flex; flex-direction: column; gap: 16px; background: {{c.bg}}; color: {{c.ink}}; font-family: 'DM Sans', system-ui, sans-serif;">

<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 13px; font-weight: 500; color: {{c.muted}};">Pazartesi, 21 Eylül</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;">Günaydın!</h1>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: {{c.surface}}; border: 1px solid {{c.line}};">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 7 18z"></path></svg>
<div style="display: flex; flex-direction: column; line-height: 1.1;">
<span style="font-size: 15px; font-weight: 700;">22°</span>
<span style="font-size: 11px; color: {{c.muted}};">İstanbul</span>
</div>
</div>
</header>

<section aria-label="Bugünün kombini" style="background: {{c.surface}}; border-radius: 28px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 0 {{c.line}};">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 0;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#F0643A" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
Bugünün kombini
</span>
<span style="font-size: 12px; color: {{c.muted}};">Kayıtlı kombinlerinden</span>
</div>
<div style="height: 250px; border-radius: 20px; background: {{c.stage}}; position: relative; overflow: hidden;">
<sc-for list="{{look}}" as="g" hint-placeholder-count="4">
<svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; left: {{g.x}}px; top: {{g.y}}px; width: {{g.s}}px; height: {{g.s}}px; transform: rotate({{g.r}}deg); filter: drop-shadow(0 6px 10px rgba(29,25,21,0.18));"><path d="{{g.d}}" fill="{{g.c}}" stroke="#1D1915" stroke-width="1.6" stroke-linejoin="round"></path></svg>
</sc-for>
<span style="position: absolute; right: 12px; bottom: 12px; padding: 6px 10px; border-radius: 999px; background: {{c.surface}}; font-size: 12px; font-weight: 600;">Son giyilme: 12 gün önce</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px;">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em;">Ofis günü, rahat şık</h2>
<div style="display: flex; gap: 6px; flex-wrap: wrap;">
<span style="padding: 5px 10px; border-radius: 999px; background: {{c.chip}}; font-size: 12px; font-weight: 600;">İş</span>
<span style="padding: 5px 10px; border-radius: 999px; background: {{c.chip}}; font-size: 12px; font-weight: 600;">Havaya uygun</span>
<span style="padding: 5px 10px; border-radius: 999px; background: {{c.chip}}; font-size: 12px; font-weight: 600;">Akşam serin: ceket al</span>
</div>
</div>
<div style="display: flex; gap: 8px;">
<button type="button" style="flex-grow: 1; height: 52px; border: none; border-radius: 16px; background: {{c.ink}}; color: {{c.bg}}; font-size: 16px; font-weight: 700;">Bunu giydim</button>
<button type="button" style="width: 120px; height: 52px; border: 1.5px solid {{c.ink}}; border-radius: 16px; background: transparent; color: {{c.ink}}; font-size: 15px; font-weight: 600;">Sıradaki</button>
</div>
</section>

<section aria-label="Alternatifler" style="display: flex; flex-direction: column; gap: 8px;">
<h3 style="margin: 0; padding: 0 4px; font-size: 14px; font-weight: 700;">Bugün için 2 alternatif</h3>
<div style="display: flex; gap: 10px;">
<sc-for list="{{alts}}" as="a" hint-placeholder-count="2">
<a href="#" style="flex: 1 1 0; height: 76px; box-sizing: border-box; padding: 8px 12px 8px 8px; border-radius: 18px; background: {{c.surface}}; display: flex; align-items: center; gap: 8px; text-decoration: none; color: {{c.ink}};">
<div style="width: 60px; height: 60px; border-radius: 12px; background: {{c.stage}}; display: flex; align-items: center; justify-content: center;">
<svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true"><path d="{{a.d}}" fill="{{a.c}}" stroke="#1D1915" stroke-width="2.5" stroke-linejoin="round"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 14px; font-weight: 700;">{{a.t}}</span>
<span style="font-size: 12px; color: {{c.muted}};">{{a.s}}</span>
</div>
</a>
</sc-for>
</div>
</section>

<div style="position: absolute; left: 0; bottom: 0;">
<dc-import name="TabBar" active="today" dark="{{dark}}" hint-size="390px,88px"></dc-import>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const P = {
      tee: 'M32 14 L44 9 Q50 16 56 9 L68 14 L84 30 L74 40 L68 34 L68 90 L32 90 L32 34 L26 40 L16 30 Z',
      blazer: 'M30 10 L44 8 L50 40 L56 8 L70 10 L86 62 L76 66 L70 42 L70 92 L30 92 L30 42 L24 66 L14 62 Z',
      jeans: 'M30 8 L70 8 L77 92 L58 92 L50 36 L42 92 L23 92 Z',
      loafer: 'M10 66 Q14 52 30 54 L60 58 Q86 60 90 70 L90 78 L10 78 Z',
      dress: 'M41 6 L59 6 L57 26 L76 92 L24 92 L43 26 Z',
      knit: 'M32 12 L44 8 Q50 14 56 8 L68 12 L88 62 L78 66 L68 38 L68 90 L32 90 L32 38 L22 66 L12 62 Z'
    };
    const c = dark
      ? { bg: '#15120F', surface: '#211D18', stage: '#2C2721', chip: '#2C2721', ink: '#F3ECE2', muted: '#A99F93', line: '#37302A' }
      : { bg: '#F5EFE6', surface: '#FFFCF7', stage: '#EDE5D8', chip: '#F5EFE6', ink: '#1D1915', muted: '#6A6158', line: '#E2D8C9' };
    return {
      dark,
      c,
      look: [
        { d: P.blazer, c: '#C99A6B', x: 16, y: 14, s: 142, r: -6 },
        { d: P.tee, c: '#FFFFFF', x: 112, y: 22, s: 112, r: 5 },
        { d: P.jeans, c: '#4A6FA5', x: 196, y: 58, s: 126, r: 3 },
        { d: P.loafer, c: '#3A2E26', x: 36, y: 150, s: 104, r: -4 }
      ],
      alts: [
        { d: P.dress, c: '#A99BF5', t: 'Hafif ve rahat', s: 'Elbise + babet' },
        { d: P.knit, c: '#E9D8A6', t: 'Katmanlı', s: 'Triko + etek' }
      ]
    };
  }
}
</script>
</body>
</html>
